<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Snapback</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#0B0C0F;--surface:#15171C;--text:#F4F4F5;--muted:#9AA0AA;--lime:#C6F432;--stroke:rgba(255,255,255,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 20px 80px}
.brand{display:flex;align-items:center;gap:10px;font:700 20px "Bricolage Grotesque",system-ui;color:var(--text);text-decoration:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lime)}
h1{font:700 clamp(32px,7vw,44px)/1.05 "Bricolage Grotesque",system-ui;letter-spacing:-.03em;margin:36px 0 8px}
.updated{color:var(--muted);font-size:14px;margin:0 0 24px}
h2{font-size:18px;margin:36px 0 8px}
p{color:var(--muted);margin:0 0 12px}
.intro{color:var(--text)}
nav{margin-top:48px;padding-top:20px;border-top:1px solid var(--stroke);display:flex;gap:20px;font-size:14px}
a{color:var(--lime)}
</style></head><body><main>
<span class="brand">Snapback<span class="dot"></span></span>
<h1>Never miss a return window again.</h1>
<p class="intro">Snap a receipt and Snapback counts down your return deadline and warranty, then nudges you before money slips away.</p>
<nav><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a><a href="mailto:snapback.support@gmail.com">Support</a></nav>
</main></body></html>
